# Rewrites any /vX.Y/ Docker Engine API prefix to /v1.40/ before forwarding.
#
# Why this exists: Traefik's bundled Docker client hardcodes its initial
# version-negotiation call to the historical default API version (1.24).
# This host's Docker Engine (Moby v2) enforces MinAPIVersion 1.40 and
# rejects anything older with a hard 400 instead of the traditional
# graceful downgrade — so negotiation never completes and the Docker
# provider never discovers any containers. Normalizing the version prefix
# here is a workaround for that client/engine mismatch, not a permanent
# fix; drop this shim once Traefik's vendored client catches up.
events {}

http {
  server {
    listen 2376;

    location / {
      rewrite ^/v[0-9]+\.[0-9]+/(.*)$ /v1.40/$1 break;
      proxy_pass http://docker-socket-proxy:2375;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
